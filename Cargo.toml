[package]
name = "skillstow"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HCID274/SkillStow"
description = "给 AI skill 用的 GNU Stow：一个 git 仓库存真身，软链投影到各个 AI 工具目录"

# 依赖白名单见 docs/SPEC.md 第 6 节。
# 明确不允许：tokio、libgit2/gitoxide、notify、任何 HTTP 客户端、任何加密库。
[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
