[package]
name = "skillstow"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/HCID274/SkillStow"
description = "个人 AI Skills 模块的多设备 Git 同步：一个仓库存真身，按清单应用到各端客户端"

# 依赖保持最少；明确不允许：tokio、libgit2/gitoxide、notify、任何 HTTP 客户端、任何加密库。
[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
strip = true
